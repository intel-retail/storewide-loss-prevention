services:
  # NPU device mapping. Included by the Makefile only when the selected
  # configs/res/*.env profile uses NPU for detection or re-identification.
  lp-video:
    devices:
      - /dev/accel:/dev/accel
    device_cgroup_rules:
      - "c 261:* rmw"
