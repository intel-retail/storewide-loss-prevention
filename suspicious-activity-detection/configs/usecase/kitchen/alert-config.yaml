service:
  retry_attempts: 3
  retry_interval_seconds: 5

subscriptions:
  - alert_type: LOITERING
    dedup:
      enabled: true
      strategy: field_hash
      fields:
        - metadata.person_id
        - metadata.zone_id
      window_seconds: 15
      on_missing: skip
      hash:
        algorithm: sha1
        truncate: 16
    delivery:
      - type: mqtt
        topic: alerts/loitering
      - type: log

  - alert_type: FOOD_SAFETY_VIOLATION
    dedup:
      enabled: true
      strategy: field_hash
      fields:
        - metadata.person_id
        - metadata.zone_id
      window_seconds: 15
      on_missing: skip
      hash:
        algorithm: sha1
        truncate: 16
    delivery:
      - type: mqtt
        topic: alerts/food_safety_violation
      - type: log