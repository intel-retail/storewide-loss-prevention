# Scenario: retail

vlm_settings:
  endpoint: "http://ovms-vlm:8001"
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  timeout: 30.0
  max_tokens: 50
  temperature: 0.1
  max_image_size: 256
  max_concurrency: 1

patterns:
  shelf_to_waist:
    description: "Hand takes item from shelf and conceals it against body"
    enabled: true
    alert_type: CONCEALMENT
    pose:
      per_side: true
      min_pose_confidence: 0.3
      min_confidence_for_alert: 0.30
      phases:
        - name: arm_handling_near_body
          min_frames: 5
          conditions:
            - subject: elbow
              relation: bent
              reference: [shoulder, wrist]
              min_angle: 20
              max_angle: 165
            - subject: wrist
              relation: near
              reference: waist_midpoint
              threshold: 0.40
    vlm:
      enabled: true
      num_frames: 4
      confidence_threshold: 0.7
      prompt: |
        You are a loss-prevention analyst. These cropped frames show one person whose hand was detected moving from shelf height to waist level. The pose system already confirmed the hand motion.

        Your task: determine if the hand appears to be CONCEALING an item against the body.

        Output JSON only: {"reasoning":"one sentence describing what you see","suspicious":true|false,"confidence":0.0-1.0}
      response_fields:
        - reasoning
        - suspicious
        - confidence

  loitering:
    description: "Person remains stationary in a restricted area for too long"
    enabled: false
    alert_type: LOITERING
    pose:
      per_side: false
      window_size: 15
      phases:
        - name: stationary
          min_frames: 15
          conditions:
            - subject: left_hip
              relation: stationary
              threshold: 0.05
    vlm:
      enabled: true
      num_frames: 4
      prompt: |
        Analyze these sequential frames of a person in a store. Determine if the person appears to be loitering.

        Respond ONLY with valid JSON: {"suspicious": true or false, "confidence": 0.0 to 1.0, "reasoning": "brief description"}
      response_fields:
        - suspicious
        - confidence
        - reasoning